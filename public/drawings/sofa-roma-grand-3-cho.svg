<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Be Vietnam Pro', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#523D2A"/>
    </marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#E8DFD3" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1000" height="640" fill="#FEF9F2"/>
  <rect width="1000" height="640" fill="url(#grid)"/>
  <rect x="12" y="12" width="976" height="616" fill="none" stroke="#523D2A" stroke-width="1.5"/>

  <g font-size="13" font-weight="700" fill="#523D2A" letter-spacing="2">
    <text x="80" y="80">MẶT ĐỨNG CHÍNH</text>
    <text x="680" y="80">MẶT ĐỨNG CẠNH</text>
    <text x="80" y="330">MẶT BẰNG</text>
  </g>

  <!-- FRONT ELEVATION (cm × 1.6) -->
  <g transform="translate(80,110) scale(1.6)" stroke="#523D2A" fill="none" stroke-width="0.9">
    <line x1="-14" y1="78" x2="272" y2="78" stroke-width="0.5"/>
    <rect x="22" y="0" width="216" height="40" rx="6" fill="#A87A55"/>
    <line x1="94" y1="4" x2="94" y2="35" stroke-width="0.5"/>
    <line x1="166" y1="4" x2="166" y2="35" stroke-width="0.5"/>
    <rect x="22" y="35" width="216" height="35" rx="3" fill="#7A4B29"/>
    <line x1="94" y1="35" x2="94" y2="50" stroke="#EDE8DF" stroke-width="0.5"/>
    <line x1="166" y1="35" x2="166" y2="50" stroke="#EDE8DF" stroke-width="0.5"/>
    <rect x="0" y="18" width="22" height="52" rx="6" fill="#8C5A35"/>
    <rect x="238" y="18" width="22" height="52" rx="6" fill="#8C5A35"/>
    <rect x="6" y="70" width="6" height="8" fill="#1D1B17"/>
    <rect x="248" y="70" width="6" height="8" fill="#1D1B17"/>
    <!-- width -->
    <line x1="0" y1="81" x2="0" y2="95" stroke-width="0.4"/>
    <line x1="260" y1="81" x2="260" y2="95" stroke-width="0.4"/>
    <line x1="0" y1="91" x2="260" y2="91" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="130" y="87" font-size="8" font-weight="700" fill="#1D1B17" stroke="none" text-anchor="middle">D 260</text>
    <!-- height -->
    <line x1="263" y1="0" x2="277" y2="0" stroke-width="0.4"/>
    <line x1="273" y1="0" x2="273" y2="78" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text font-size="8" font-weight="700" fill="#1D1B17" stroke="none" text-anchor="middle" transform="translate(269,39) rotate(-90)">C 78</text>
    <!-- seat height -->
    <line x1="-3" y1="35" x2="-17" y2="35" stroke-width="0.4"/>
    <line x1="-13" y1="35" x2="-13" y2="78" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text font-size="7" fill="#4E453E" stroke="none" text-anchor="middle" transform="translate(-16,56.5) rotate(-90)">Ngồi 43</text>
  </g>

  <!-- SIDE ELEVATION -->
  <g transform="translate(680,110) scale(1.6)" stroke="#523D2A" fill="none" stroke-width="0.9">
    <line x1="-14" y1="78" x2="118" y2="78" stroke-width="0.5"/>
    <path d="M2 20 L5 3 Q6 0 9 0 L20 0 L24 20 Z" fill="#A87A55"/>
    <rect x="0" y="18" width="102" height="52" rx="6" fill="#8C5A35"/>
    <rect x="4" y="70" width="6" height="8" fill="#1D1B17"/>
    <rect x="92" y="70" width="6" height="8" fill="#1D1B17"/>
    <!-- depth -->
    <line x1="0" y1="81" x2="0" y2="95" stroke-width="0.4"/>
    <line x1="102" y1="81" x2="102" y2="95" stroke-width="0.4"/>
    <line x1="0" y1="91" x2="102" y2="91" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="51" y="87" font-size="8" font-weight="700" fill="#1D1B17" stroke="none" text-anchor="middle">R 102</text>
    <!-- height -->
    <line x1="-3" y1="0" x2="-17" y2="0" stroke-width="0.4"/>
    <line x1="-13" y1="0" x2="-13" y2="78" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text font-size="8" font-weight="700" fill="#1D1B17" stroke="none" text-anchor="middle" transform="translate(-16,39) rotate(-90)">C 78</text>
    <!-- arm height -->
    <line x1="105" y1="18" x2="119" y2="18" stroke-width="0.4"/>
    <line x1="115" y1="18" x2="115" y2="78" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text font-size="7" fill="#4E453E" stroke="none" text-anchor="middle" transform="translate(112,48) rotate(-90)">Tay vịn 60</text>
  </g>

  <!-- PLAN VIEW -->
  <g transform="translate(80,360) scale(1.6)" stroke="#523D2A" fill="none" stroke-width="0.9">
    <rect x="0" y="0" width="260" height="102" rx="4" fill="#F2EDE6"/>
    <rect x="22" y="0" width="216" height="22" fill="#A87A55"/>
    <rect x="22" y="22" width="72" height="80" fill="#FEF9F2"/>
    <rect x="94" y="22" width="72" height="80" fill="#FEF9F2"/>
    <rect x="166" y="22" width="72" height="80" fill="#FEF9F2"/>
    <rect x="0" y="0" width="22" height="102" rx="4" fill="#8C5A35"/>
    <rect x="238" y="0" width="22" height="102" rx="4" fill="#8C5A35"/>
    <text x="130" y="66" font-size="8" fill="#4E453E" stroke="none" text-anchor="middle">Mặt ngồi rộng 216 · sâu 62</text>
    <!-- width -->
    <line x1="0" y1="105" x2="0" y2="119" stroke-width="0.4"/>
    <line x1="260" y1="105" x2="260" y2="119" stroke-width="0.4"/>
    <line x1="0" y1="115" x2="260" y2="115" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="130" y="111" font-size="8" font-weight="700" fill="#1D1B17" stroke="none" text-anchor="middle">D 260</text>
    <!-- depth -->
    <line x1="263" y1="0" x2="277" y2="0" stroke-width="0.4"/>
    <line x1="263" y1="102" x2="277" y2="102" stroke-width="0.4"/>
    <line x1="273" y1="0" x2="273" y2="102" stroke-width="0.6" marker-start="url(#a)" marker-end="url(#a)"/>
    <text font-size="8" font-weight="700" fill="#1D1B17" stroke="none" text-anchor="middle" transform="translate(269,51) rotate(-90)">R 102</text>
  </g>

  <!-- TITLE BLOCK -->
  <g font-size="12" fill="#1D1B17">
    <line x1="12" y1="580" x2="988" y2="580" stroke="#523D2A" stroke-width="1"/>
    <text x="30" y="609" font-weight="700" fill="#523D2A" letter-spacing="1">CDH-SF-01 · SOFA BĂNG DA Ý ROMA GRAND — 3 CHỖ</text>
    <text x="600" y="609">Kích thước tổng: D 260 × R 102 × C 78</text>
    <text x="970" y="609" text-anchor="end" fill="#4E453E">Đơn vị: cm</text>
  </g>
</svg>
